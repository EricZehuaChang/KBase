# KBase CI 门禁（触发壳）：push/PR 到 main、feature/** 与 v* tag 时跑核心
# 测试门禁（ci-core.yml）。设计依据与 job 细节见 ci-core.yml 头注释与
# projects/project06-kbase/deliverables/2026-09-07-CI接入规划.md。
# 镜像构建由 docker-ci.yml（按路径过滤）负责，nightly/release 直接复用 ci-core。
name: ci

on:
  push:
    branches: [main, "feature/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-core:
    uses: ./.github/workflows/ci-core.yml
    with:
      # 只有 feature 分支的普通 push 跳过 PG 集成（省免费分钟数，规划 §5-10）；
      # main push / PR / tag / 手动 都全量。= 非「feature push」即跑。
      run-pg: ${{ !(github.event_name == 'push' && github.ref != 'refs/heads/main') }}
