# Docker 镜像真构建 + 冒烟（可复用 workflow）。
# 调用方：docker-ci.yml（main push/PR，按路径过滤）、nightly.yml（每日）、
# release.yml（发版前）。构建不推送（push: false, load: true），产物只在本
# runner 内做冒烟；现行部署走 git archive + scp + 服务器本地 build，不用 registry。
#
# 冒烟为什么是「容器内 import」而不是启动 uvicorn：lite 默认 embedder 是
# bge-local（6.6GB 权重下载），启动即触发下载。import 冒烟已能拦住历史上
# 真踩过的坑——mcp 2.x 改名导致构建期通过、运行期 ImportError（2026-09-02）。
#
# ⚠️ 每个 docker run 都必须显式 --entrypoint（python/sh/timeout）：
# 镜像 ENTRYPOINT 是 entrypoint.sh，不带 --entrypoint 时 docker run 会把附加
# 参数原样塞给 entrypoint.sh，而它 `exec uvicorn --factory ...` **忽略这些参数**
# 直接启动真应用 → bge-m3 下载/加载，冒烟变成"启动服务"（2026-09-07 实测：
# 首跑冒烟单步挂 26 分钟、重跑仍失败，浪费两轮 30min+ 构建，真因即此）。
#
# 容器内 timeout（Debian slim 自带 coreutils）：单步异常不至于吃掉整个 job
# 预算；exit 124 = 超时被杀，步骤红。步骤级 timeout-minutes 再兜一层。
name: docker-build

on:
  workflow_call:

jobs:
  docker:
    name: docker (镜像构建 + import 冒烟)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: kbase:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 冒烟 1——应用模块逐个可导入（拦 mcp 2.x / 依赖缺失类运行期 ImportError）
        timeout-minutes: 10
        run: |
          for m in kbase.api.main kbase_mcp.server opendataloader_pdf; do
            echo "=== import $m ==="
            docker run --rm --entrypoint timeout kbase:ci 120 python -c "import $m; print('ok')" || exit 1
          done
      - name: 冒烟 2——sentence_transformers 可装载（torch CPU，首载可能 1-2 分钟）
        timeout-minutes: 8
        run: |
          docker run --rm --entrypoint timeout kbase:ci 240 python -c "import sentence_transformers; print('sentence_transformers ok')"
      - name: 冒烟 3——JRE 在位（opendataloader-pdf 解析回退契约的前置）
        timeout-minutes: 3
        run: docker run --rm --entrypoint sh kbase:ci -c 'java -version'
      - name: 冒烟 4——前端产物在镜像内（web/ 随 git 提交，缺了 SPA 就是空壳）
        timeout-minutes: 3
        run: |
          docker run --rm --entrypoint sh kbase:ci -c 'test -f /app/web/index.html && test -f /app/web/admin.html && echo "web artifacts ok"'
      - name: 冒烟 5——entrypoint 语法与可执行性（LF 行尾/shell 语法错误会在这红）
        timeout-minutes: 3
        run: >-
          docker run --rm --entrypoint sh kbase:ci -c
          'sh -n /app/entrypoint.sh && test -x /app/entrypoint.sh && echo "entrypoint ok"'
