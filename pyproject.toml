[project]
name = "kbase"
version = "0.1.0"
description = "KBase 私有化知识库系统"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    # 上界必须钉：1.x 换成 Rust 内核（chromadb_rust_bindings），每个 client
    # 起一套 tokio runtime，测试套里多实例会堆到两千多线程后整个进程卡死
    # （2026-09-02 实测 1.5.9：0% CPU、无网络，sample 显示主线程停在 Rust 绑定内）。
    "chromadb>=0.5,<1",
    "qdrant-client>=1.10",
    "markitdown[docx,pptx,xlsx,pdf]>=0.1",
    # 文本层 PDF 主解析器（真实标题层级/阅读序/边框表格，见 ingest/pdf_odl）。
    # 纯包装+内置 JAR、零传递依赖；运行时需 Java 11+，缺失时自动回退
    # markitdown（部署不带 JRE 只损失 PDF 结构质量，不影响可用性）。
    # 钉 2.x：2.0 起 Apache-2.0（更早版本是 MPL-2.0，不用）。
    "opendataloader-pdf>=2.5,<3",
    "langchain-text-splitters>=0.3",
    "openai>=1.40",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    "jieba>=0.42",
    "pypdf>=4.0",
    "httpx>=0.27",
    "python-docx>=1.1",
    # 多模态插图（提取/尺寸过滤/演示流程图生成）必须在主依赖——曾只在
    # dev extra，生产镜像装不上会让插图功能静默失效（提图 try/except 吞掉）
    "pillow>=10",
    "passlib[bcrypt]>=1.7",
    # bcrypt>=4.1 移除了 passlib 1.7.4 探测版本时读取的 __about__ 属性，
    # 触发其 wrap-bug 探测路径抛 ValueError（与内容无关，任何密码都会炸）；
    # 锁定 <4.1 保留兼容性，同时满足 chromadb 的 bcrypt>=4.0.1 下限。
    "bcrypt>=4.0.1,<4.1",
    "PyJWT>=2.8",
    # kbase/license.py 的 Ed25519 验签直接依赖；此前只是通过 markitdown[pdf]
    # ->pdfminer.six 间接拉入，改成显式声明避免那条传递链变化时悄悄消失。
    "cryptography>=42.0",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
local-embed = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]
# mcp 2.x 把 FastMCP 改名为 MCPServer（mcp.server.fastmcp 整个模块没了），
# kbase_mcp/server.py 用的是 v1 API；不加上界的话新环境装 2.x 会让镜像
# 构建期通过、MCP Server 运行期直接 ImportError（2026-09-02 实测 2.1.1）。
mcp = ["mcp>=1.2,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "external: 需要网络或大模型下载，默认跳过",
    "pg: 需要真实 PostgreSQL（设置 KBASE_TEST_PG_URL 才跑），默认跳过",
]
addopts = "-m 'not external and not pg'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kbase", "kbase_mcp"]
