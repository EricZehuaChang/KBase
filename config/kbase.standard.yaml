# KBase standard profile 运行配置：搭配 docker-compose.standard.yml 使用，
# 各 endpoint 指向 compose 内的服务名（Docker 内置 DNS 按 service name 解析），
# 与 config/kbase.yaml（lite，进程内模型 + SQLite + Chroma）互不影响。
#
# 密钥一律走环境变量：db 密码由 db.password_env 指定变量名（见下方 db 段）、
# DASHSCOPE_API_KEY 等在生产环境由 docker-compose.standard.yml 的
# environment/.env 注入，本文件不写明文密钥。
data_dir: ./data

embedder:
  name: tei
  endpoint: http://tei-embed:80

vectorstore:
  name: qdrant
  endpoint: http://qdrant:6333
  # Qdrant 本身未在 compose 里开鉴权（局域网内部访问），云端托管 Qdrant 才需要：
  # api_key: ${QDRANT_API_KEY}

chunker:
  name: structure
  chunk_size: 512
  chunk_overlap: 64

retrieval:
  rerank:
    name: tei
    endpoint: http://tei-rerank:80
    # M4-2 H6.5：单卡 L4 上 TEI-rerank 的交叉编码器推理吞吐是固定物理上限
    # （H6 压测实测约 260ms/次，与批大小/并发无关）。max_concurrency 限制
    # 同时在途的重排调用数，超出的查询非阻塞跳过重排、降级为融合排序（见
    # kbase/rag/retriever.py）。8 是默认值，此处显式写出以便压测时调参。
    max_concurrency: 8

# PostgreSQL 元数据库：url 里**不写密码**，由 db.password_env 指名的环境变量
# 在启动时渲染（kbase/config.py:resolve_db_url → make_url().set(password=...)，
# 特殊字符自动转义）。变量缺失会直接报错，不会静默用错密码连库。
# compose 的 app.environment 已透传 POSTGRES_PASSWORD（与 postgres 服务同源），
# 只设这一个变量即可完成连库。
db:
  url: postgresql+psycopg://kbase@postgres:5432/kbase
  password_env: POSTGRES_PASSWORD

# M4-2 H7：AnyIO 线程池容量可配（默认 40）。实测教训（loadtest/report-standard.md）：
# 在 4 vCPU 参考机上调到 120 反而使 100 并发 P95 回退约 20%——线程数超过
# CPU 真并行能力后只增加 GIL/调度争抢。仅当部署机 vCPU 充裕（≥16）且压测
# 验证有收益时才调大；默认保持 40。
server:
  threadpool_size: 40

# LLM 网关配置与 lite 一致（standard profile 只替换 embedder/vectorstore/
# rerank/db 四个插槽，LLM 走同一套 DashScope 网关，不受 profile 影响）。
llm:
  active: qwen-plus
  providers:
    - name: qwen-plus
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key_env: DASHSCOPE_API_KEY
      model: qwen-plus
      max_concurrency: 4
    - name: qwen-max
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key_env: DASHSCOPE_API_KEY
      model: qwen-max
      max_concurrency: 4
    - name: deepseek-v3
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key_env: DASHSCOPE_API_KEY
      model: deepseek-v3
      max_concurrency: 4
    - name: qwen3-32b
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key_env: DASHSCOPE_API_KEY
      model: qwen3-32b
      max_concurrency: 4
      params:
        extra_body:
          enable_thinking: false

# OCR：MonkeyOCR 运行在 compose 之外（GPU 服务，与 standard 栈共存但独立
# 生命周期管理，见设计文档 §4）。host.docker.internal 让容器访问宿主机端口
# ——Linux 宿主需要在 compose 里额外加 extra_hosts（见 docker-compose.standard.yml
# 里 app 服务的 extra_hosts 段），Docker Desktop（Windows/Mac）默认已支持。
ocr:
  enabled: true
  backend: monkey-http
  endpoint: "http://host.docker.internal:7861"

# 答案级评测（T15）默认关闭。standard 栈里 providers 清单已有 deepseek-v3，
# 打开时把裁判指到它——判分是"对照参考答案给 0~1 分"的结构化任务，不需要
# qwen-max 的推理深度，用便宜档评全量用例才跑得起。
# 关着（默认）时评测集回归只跑检索（hit@k/MRR），零 LLM 调用，与升级前一致。
evals:
  answer_judge:
    enabled: false
    provider: deepseek-v3

# 许可证（T16）。**enforce 默认 false 是产品负责人明确拍板的结果，不是漏配**：
# 原话"授权到期，直接拦截，现阶段当前不拦截，留一个开关给我，没有交付客户"
# ——拦截代码路径真实存在且有测试覆盖（tests/test_license.py 的 enforce=true
# 用例 + 离线续期全链路用例），但当前交付里先不拦，开关留在他手里随时可开。
#
# enforce: false —— 不拦任何业务请求，许可证只用于状态展示（与升级前一致）；
#          true  —— 授权到期（且超出 grace_days 宽限期）后，业务端点一律
#          402 license_expired；豁免清单 = /api/license（查状态 + 上传续期）、
#          /api/auth/*（登录）、/healthz、/metrics，保证管理员仍能登录并上传
#          新的 license.json 完成离线续期（见 kbase/license.py 的
#          ALLOWED_EXACT）。
# grace_days: 到期后仍放行的天数（默认 14），给现场留出上传新证的时间窗；
#          0 = 到期即拦。仅在 enforce=true 时有意义。
#
# features（功能位，见 scripts/gen_license.py --feature）：证书里没有某功能位
# 时对应端点 402 license_feature_denied（同样只在 enforce=true 时生效）；
# 证书 features 缺省 = 不限功能（老证书不会因为升级被锁功能）。
# 可选值：governance / sso / audit_export / ops_attribution / answer_eval /
# bundle_export。
license:
  enforce: false
  grace_days: 14

# 企业 SSO（M6-8，OIDC 授权码流）。**默认关**——不配置就完全不暴露 SSO 端点
# （/api/auth/sso/* 返回 404），登录页也不会显示"企业账号登录"按钮。
# 对接真 IdP 的完整步骤、要登记的 redirect URI、踩过的坑，见
# docs/manual/KBase-完整手册.md 的「对接真实 IdP（SSO）」一节。
# client_secret 不写在这里，走环境变量（见 client_secret_env）。
sso:
  enabled: false
  # issuer 必须与 IdP discovery 文档里的 issuer 字段**逐字节**一致
  # （如 https://idp.corp.com/realms/main），末尾不要多余的斜杠。
  issuer: ""
  client_id: ""
  client_secret_env: KBASE_OIDC_CLIENT_SECRET
  # 首次 SSO 登录自动建号时给的角色（viewer/editor/admin/superadmin）。
  # 已有账号的角色不受影响，仍在 KBase 用户管理页调整。
  default_role: viewer
  # 是否允许 IdP 身份落到 KBase 里已存在、但从未绑定过 SSO 的同名账号上。
  # 默认 false：否则 IdP 里一个叫 admin 的用户登录一次就能拿到 KBase 超管。
  # 需要"管理员先建号、再让 SSO 登录进来"的部署再打开。
  allow_existing_users: false
