# KBase 运行配置。密钥一律走环境变量（api_key_env 指定变量名），本文件可入库。
data_dir: ./data
# 登录/口令端点的人机闸（T11）：窗口内失败次数达阈值 → 429 + Retry-After，
# 退避随失败档位指数增长（默认 5 次→30s、6→60s、7→120s …… 上限 900s）。
# 计数源是 audit_logs 表里的失败留痕（login_failed 等），**不建新表**，因此
# 多 worker/多副本共用同一份计数（与 T09 的进程内 API Key 限流不同，后者在
# standard 档只能承诺每进程近似）。判定维度：/api/auth/login 按"同一用户名"
# 与"同一来源 IP"各算一遍、任一达阈值即锁；forgot/reset 只按来源 IP。
# 各键含义与默认值见 kbase/config.py 的 LoginGuardConfig；正常使用撞不上这几
# 个阈值，只在被爆破时生效。
# 注：IP 维度取传输层对端地址（不信任 X-Forwarded-For，与 T09 的 Key 白名单、
# 审计 ip 同一口径）。若部署在未透传真实来源的反代后面，它看到的是代理地址、
# 会退化成"整个出口"一道闸——那种部署应调大 max_attempts 留余量（用户名维度
# 不受影响，仍按账号各自计数）。
login_guard:
  max_attempts: 5            # 窗口内同一用户名/同一 IP 的失败次数阈值（>= 即锁）
  window_seconds: 900        # 计数窗口 15 分钟，同时也是锁定时长的上界
  backoff_base_seconds: 30   # 刚达阈值时的 Retry-After
  backoff_max_seconds: 900   # 指数退避的上限
embedder:
  name: bge-local
  model: BAAI/bge-m3
# KB 级可选向量模型清单（M5-2）：建库时可在 [默认模型]+此清单中选一个绑定，
# 绑定后该库所有摄取/查询固定用它（不同模型向量空间不可比，建库后不可改，
# 换模型需重建库）。id 是 KB 绑定引用的稳定标识，上线后只增不改名。
# embedders:
#   - id: qwen-embed-v3            # 阿里云 DashScope 向量模型（云 API）
#     plugin: openai-embed
#     base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
#     api_key_env: DASHSCOPE_API_KEY
#     model: text-embedding-v3
#   - id: tei-bge                  # 自建 TEI 推理服务
#     plugin: tei
#     endpoint: http://localhost:8080
vectorstore:
  name: chroma
chunker:
  name: structure
  chunk_size: 512
  chunk_overlap: 64
# retrieval 各键默认值见 kbase/config.py RetrievalConfig，按需在此覆盖。
# 注意：rewrite.mode 必须带引号（"off" 不加引号会被 YAML 解析为布尔 False，启动时报校验错误）。
# T17 上下文预算 retrieval.context_budget（字符，缺省不写=不限）：一次检索交给
# 生成层的上下文**总量**上限——块少可以多给，块多就得少给。与 max_parent_chars
# 的区别是后者管单块（每块各自 4000 字），这里管所有块加起来。超预算时表格块
# 退化为「表头+命中行+共 N 行（已截断）」、普通文本块按剩余预算截窗，前端引用
# 旁标「已截断」。可按库覆盖（KB 配置 retrieval.context_budget）或按请求覆盖
# （/api/kb/{id}/search 的 context_budget）。定值时按所选 LLM 的上下文窗口留出
# 问题+历史+回答的余量：中文 1 字符≈1 token，中英混排按 1.5 倍估更稳。
# retrieval:
#   context_budget: 8000
llm:
  # 四厂商 × 两档（性价比 + 最强），2026-07-15 按各家 /models 端点实测清单选定。
  # 关键经验：2026 代旗舰默认开思考模式，首 token 会拖到 5~10s+，非深推理
  # 场景一律用 params 关闭（qwen 系 enable_thinking:false；智谱/deepseek 系
  # thinking.type=disabled，均实测有效）。密钥走环境变量，或在管理端设置页
  # 对任一 provider 直接填 API Key（存 DB，优先于环境变量）。
  active: glm-5-turbo             # 性价比档实测延迟最稳（约1s）且国内网络可靠
  providers:
    - name: glm-5-turbo           # 智谱·性价比档
      base_url: https://open.bigmodel.cn/api/paas/v4
      api_key_env: ZHIPU_API_KEY
      model: glm-5-turbo
      max_concurrency: 4
      params:
        extra_body:
          thinking:
            type: disabled
    - name: glm-5.2               # 智谱·最强档
      base_url: https://open.bigmodel.cn/api/paas/v4
      api_key_env: ZHIPU_API_KEY
      model: glm-5.2
      max_concurrency: 4
      params:
        extra_body:
          thinking:
            type: disabled
    - name: qwen3.7-plus          # 通义·性价比档
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key_env: DASHSCOPE_API_KEY
      model: qwen3.7-plus
      max_concurrency: 4
      params:
        extra_body:
          enable_thinking: false
    - name: qwen3.7-max           # 通义·最强档
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key_env: DASHSCOPE_API_KEY
      model: qwen3.7-max
      max_concurrency: 4
      params:
        extra_body:
          enable_thinking: false
    - name: deepseek-v4-flash     # DeepSeek·性价比档（实测 ~1s）
      base_url: https://api.deepseek.com/v1
      api_key_env: DEEPSEEK_API_KEY
      model: deepseek-v4-flash
      max_concurrency: 4
      params:
        extra_body:
          thinking:
            type: disabled
    - name: deepseek-v4-pro       # DeepSeek·最强档（深推理，首响应 ~5s，复杂问题用）
      base_url: https://api.deepseek.com/v1
      api_key_env: DEEPSEEK_API_KEY
      model: deepseek-v4-pro
      max_concurrency: 4
      params:
        extra_body:
          thinking:
            type: disabled
    - name: gpt-5.4-mini          # OpenAI·性价比档；国内网络直连能否可达
      base_url: https://api.openai.com/v1   # 因环境而异，接入前先在设置页点"测试"
      api_key_env: OPENAI_API_KEY
      model: gpt-5.4-mini
      max_concurrency: 4
    - name: gpt-5.4               # OpenAI·最强档
      base_url: https://api.openai.com/v1
      api_key_env: OPENAI_API_KEY
      model: gpt-5.4
      max_concurrency: 4
    - name: kimi-k3               # 月之暗面 Kimi·K3（推理档；密钥走 MOONSHOT_API_KEY）
      # 与其他厂商相反：k3 是推理模型，此处用 reasoning_effort 主动开高推理力度
      # （实测 Moonshot 接受该 body 参数）；不需要"关思考"。
      base_url: https://api.moonshot.cn/v1
      api_key_env: MOONSHOT_API_KEY
      model: kimi-k3
      max_concurrency: 4
      params:
        extra_body:
          reasoning_effort: high
    # iruidong 中转（2026-09-04）：https://api.iruidong.com/v1，key 走 IRUIDONG_API_KEY。
    # OpenAI 兼容，提供 GLM-5.3-Flash / DeepSeek V4 Flash / DeepSeek V4 Pro / GLM-5.3。
    # 名称独立于内置厂商，避免 provider 解析重名。
    - name: iruidong-glm-flash
      base_url: https://api.iruidong.com/v1
      api_key_env: IRUIDONG_API_KEY
      model: glm-5.3-flash
      max_concurrency: 4
    - name: iruidong-ds-flash
      base_url: https://api.iruidong.com/v1
      api_key_env: IRUIDONG_API_KEY
      model: deepseek-v4-flash
      max_concurrency: 4
    - name: iruidong-ds-pro
      base_url: https://api.iruidong.com/v1
      api_key_env: IRUIDONG_API_KEY
      model: deepseek-v4-pro
      max_concurrency: 4
    - name: iruidong-glm
      base_url: https://api.iruidong.com/v1
      api_key_env: IRUIDONG_API_KEY
      model: glm-5.3
      max_concurrency: 4
# OCR：扫描件/图片摄取时转 Markdown。两种后端：
# - glm-ocr（默认推荐）：智谱云 layout_parsing（kbase/plugins/ocr/glm_http.py），
#   密钥走 ZHIPU_API_KEY 环境变量（api_key_env 可改名）；endpoint 留空用官方云，
#   本地 vLLM 跑同一模型时指到本地服务即可（云本同源，切档零适配）。
# - monkey-http：自建 MonkeyOCR 服务（kbase/plugins/ocr/monkey_http.py），
#   endpoint 留空默认 http://localhost:7861。
# enabled=false 或服务不可达时，扫描件摄取会优雅降级为 pending_ocr（不阻塞其余文档），
# 不会导致摄取流程报错；密钥未配置同样降级为 pending_ocr，配好后批量重试即可。
# F 满血 VLM 深度识别（上传时可选的解析模式）：复杂图（概念图/时序图/
# 架构图/PPT 截图）交给强力视觉模型理解性转写，识别结果需在管理端人工
# 校验确认后才向量化。provider 必须是**支持图片输入**的模型（实测
# gpt-5.4-mini 直通；智谱/通义需其 VL 专门型号，文本旗舰不收图）。
vlm_parse:
  provider: gpt-5.4-mini
ocr:
  enabled: true
  backend: glm-ocr
  # endpoint: ""                   # 留空=智谱官方云；vLLM 本地部署时改这里
  # api_key_env: ZHIPU_API_KEY
  # model: glm-ocr
  # --- 切回自建 MonkeyOCR 时使用 ---
  # backend: monkey-http
  # endpoint: "http://localhost:7861"
# 评测回归（T15）。answer_judge.enabled 默认 false：关着时评测集回归只跑检索
# （hit@k/MRR），秒级、零 LLM 费用，且行为与升级前完全一致——这也正是默认关的
# 原因：答案级判分按用例数计费、分钟级耗时，评的是当时的**生成配置**，不该被
# 一次升级动作悄悄打开、把既有回归曲线的口径换掉。
# 打开后 POST /api/eval-sets/{id}/run 才接受 {"mode": "answer"}（否则 422）：
# 逐用例 检索→生成→裁判打分，建一个 eval_answer 任务后台跑，立刻返回 job id。
# provider 留空=用 llm.active；生产建议显式指一个便宜档——裁判是"对照参考答案
# 给 0~1 分"的结构化任务，用旗舰模型评全量用例纯属烧钱。该值会写进
# eval_runs.judge_provider 与报告，便于事后分辨"分数变了是不是换了裁判模型"。
evals:
  answer_judge:
    enabled: false
    # provider: qwen-turbo

# 许可证（T16）。**负责人拍板：当前不启用拦截，但开关留着**——所以这里显式写
# enforce: false，不是漏配。改为 true 即启用"到期超出宽限期后业务端点返回
# 402"，放行名单见 kbase/license.py（登录/状态/healthz/metrics/静态资源），
# 保证管理员仍能登录并上传新证书完成离线续期。
# 无已交付客户，故不需要过渡方案；开启前请确认这一点仍然成立。
license:
  enforce: false
  grace_days: 14
